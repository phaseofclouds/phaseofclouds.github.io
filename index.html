<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小球模拟器</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <section id="sim" class="sim">
        <canvas id="canvas"></canvas>
      </section>
      <aside class="panel">
        <h2>添加小球</h2>
        <label>名字 <input id="name" value="Ball" maxlength="12" /></label>
        <label>半径 <input id="radius" type="number" min="2" max="80" value="16" /></label>
        <label>质量 <input id="mass" type="number" min="1" max="10000" value="100" /></label>
        <label>颜色 <input id="color" type="color" value="#ff8844" /></label>
        <button id="addBtn">添加</button>
        <button id="clearBtn" class="secondary">清除所有</button>
        <p id="count">当前小球: 0 / 99</p>
        <p class="hint">使用说明：点击“添加”生成一个虚化小球跟随鼠标，移入左侧区域单击放置，移动并单击设置初速度，再次单击开始模拟。</p>
      </aside>
    </div>
    <script src="script.js"></script>
  </body>
</html>
